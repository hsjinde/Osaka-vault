name: notify-dashboard
on:
  push:
    branches: [main]
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Osaka-web rebuild
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.OSAKA_WEB_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hsjinde/Osaka-web/dispatches \
            -d '{"event_type":"vault-updated"}')
          echo "HTTP $code"
          cat /tmp/resp.txt
          if [ "$code" != "204" ]; then
            echo "::error::dispatch 失敗（HTTP $code）。401=PAT 無效/過期；404=PAT 對 Osaka-web 沒有 contents:write 權限"
            exit 1
          fi